<script>
// Menu « Aa » : taille du texte (toujours) et styles du site à l'essai. Le choix est
// mémorisé dans ce navigateur (localStorage « typweb-style »). À retirer quand
// un style est retenu (typweb.toml : [site] styles-essai = false).
(function () {
  var STYLES = [
    ["", "Actuel"],
    ["epure", "1 · Épure"],
    ["epure-types", "2 · Épure, couleurs de type"],
    ["manuel", "3 · Manuel moderne"],
    ["cahier", "4 · Cahier"],
    ["ardoise", "7 · Ardoise"],
    ["lecture", "8 · Lecture concentrée"],
    ["fiches", "9 · Fiches numérotées"]
  ];
  function courant() { try { return localStorage.getItem("typweb-style") || ""; } catch (e) { return ""; } }
  function appliquer(s) {
    if (s) document.documentElement.setAttribute("data-style", s);
    else document.documentElement.removeAttribute("data-style");
    try { if (s) localStorage.setItem("typweb-style", s); else localStorage.removeItem("typweb-style"); } catch (e) {}
    document.querySelectorAll(".st-panneau button").forEach(function (b) { b.classList.toggle("on", b.dataset.s === s); });
    window.dispatchEvent(new Event("resize"));      // figures : se redessiner
  }
  var TAILLES = [0.85, 0.92, 1, 1.08, 1.16, 1.25, 1.35, 1.5];
  function tailleCourante() { try { return parseFloat(localStorage.getItem("typweb-taille")) || 1; } catch (e) { return 1; } }
  function poserTaille(t) {
    document.documentElement.style.fontSize = t === 1 ? "" : (100 * t) + "%";
    try { if (t === 1) localStorage.removeItem("typweb-taille"); else localStorage.setItem("typweb-taille", t); } catch (e) {}
    var l = document.querySelector(".st-taille span"); if (l) l.textContent = Math.round(t * 100) + " %";
    window.dispatchEvent(new Event("resize"));      // figures : se redessiner
  }
  function pas(d) {
    var t = tailleCourante(), k = 0;
    TAILLES.forEach(function (x, j) { if (Math.abs(x - t) < Math.abs(TAILLES[k] - t)) k = j; });
    poserTaille(TAILLES[Math.max(0, Math.min(TAILLES.length - 1, k + d))]);
  }
  function build() {
    if (document.querySelector(".st-menu")) return;
    var essai = !window.TYPWEB || window.TYPWEB.stylesEssai !== false;
    var m = document.createElement("div"); m.className = "st-menu";
    var b = document.createElement("button"); b.className = "st-btn"; b.type = "button"; b.textContent = "Aa";
    b.title = "Taille du texte" + (essai ? " et style du site" : ""); b.setAttribute("aria-label", b.title);
    var p = document.createElement("div"); p.className = "st-panneau"; p.hidden = true;
    p.innerHTML = "<p>Taille du texte</p>";
    var tl = document.createElement("div"); tl.className = "st-taille";
    var moins = document.createElement("button"); moins.type = "button"; moins.textContent = "A−"; moins.title = "Réduire le texte";
    var val = document.createElement("span"); val.textContent = Math.round(tailleCourante() * 100) + " %";
    val.title = "Revenir à 100 %"; val.style.cursor = "pointer";
    var plus = document.createElement("button"); plus.type = "button"; plus.textContent = "A+"; plus.title = "Agrandir le texte";
    moins.addEventListener("click", function () { pas(-1); });
    plus.addEventListener("click", function () { pas(1); });
    val.addEventListener("click", function () { poserTaille(1); });
    tl.appendChild(moins); tl.appendChild(val); tl.appendChild(plus);
    p.appendChild(tl);
    if (essai) {
      var sep = document.createElement("div"); sep.className = "st-sep"; p.appendChild(sep);
      var t = document.createElement("p"); t.textContent = "Style du site (mode clair)"; p.appendChild(t);
      STYLES.forEach(function (s) {
        var x = document.createElement("button"); x.type = "button"; x.dataset.s = s[0]; x.textContent = s[1];
        x.addEventListener("click", function () { appliquer(s[0]); });
        p.appendChild(x);
      });
    }
    b.addEventListener("click", function () { p.hidden = !p.hidden; });
    document.addEventListener("click", function (e) { if (!m.contains(e.target)) p.hidden = true; });
    m.appendChild(p); m.appendChild(b); document.body.appendChild(m);
    if (essai) appliquer(courant());
  }
  if (document.readyState !== "loading") build(); else document.addEventListener("DOMContentLoaded", build);
})();
</script>
